# Build distributable packages (names include Cargo workspace version):
#   Windows → dist/Oxizip-Setup-<ver>-x64.exe
#   Linux   → Oxizip_*.deb / Oxizip-*.rpm / Oxizip-*.AppImage (+ tar.gz)
name: Package

on:
  # Only tags + manual. Avoid double runs when pushing main and then tagging the same commit.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"
  OXIZIP_FETCH_APPIMAGE_TOOLS: "1"

jobs:
  windows:
    name: Windows Setup.exe
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read workspace version
        id: version
        shell: pwsh
        run: |
          $toml = Get-Content -Raw Cargo.toml
          if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Cannot read version from Cargo.toml"
          }
          $ver = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            $tagVer = $Matches[1]
            if ($tagVer -ne $ver) {
              throw "Tag v$tagVer does not match Cargo.toml version $ver"
            }
          }
          # Avoid UTF-8 BOM which breaks GITHUB_OUTPUT / job outputs on Windows.
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$ver"
          Write-Host "version=$ver"

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-windows

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Build installer
        shell: pwsh
        env:
          # Limit parallelism to reduce peak memory on hosted runners.
          CARGO_BUILD_JOBS: "2"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          .\scripts\package-windows.ps1
          $ver = "${{ steps.version.outputs.version }}"
          $out = "dist\Oxizip-Setup-$ver-x64.exe"
          if (-not (Test-Path $out)) { throw "missing $out" }
          Get-Item $out | Format-List Name, Length, LastWriteTime

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: oxizip-windows-setup-${{ steps.version.outputs.version }}
          path: dist/Oxizip-Setup-*-x64.exe
          if-no-files-found: error

  linux:
    name: Linux deb / rpm / AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read workspace version
        id: version
        run: |
          VER=$(grep -E '^version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version=$VER"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VER" != "$VER" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VER" >&2
              exit 1
            fi
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            pkg-config \
            curl \
            ca-certificates \
            imagemagick \
            dpkg-dev \
            rpm \
            libx11-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-linux

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Build packages
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh
          VER="${{ steps.version.outputs.version }}"
          echo "==> dist contents"
          ls -la dist/
          test -f "dist/Oxizip_${VER}_amd64.deb" -o -f "dist/Oxizip_${VER}_arm64.deb"
          test -n "$(find dist -maxdepth 1 -name "Oxizip-${VER}-*.rpm" -print -quit)"
          test -n "$(find dist -maxdepth 1 -name "Oxizip-${VER}-*.AppImage" -print -quit)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oxizip-linux-packages-${{ steps.version.outputs.version }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: [windows, linux]
    # Tag pushes only (workflow_dispatch on a branch will build artifacts but skip Release).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: oxizip-windows-setup-${{ needs.windows.outputs.version }}
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: oxizip-linux-packages-${{ needs.linux.outputs.version }}
          path: release-assets

      - name: Require every package artifact
        id: assets
        env:
          VER: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          ls -laR release-assets/
          missing=0
          require() {
            local label=$1
            shift
            local found
            found=$(find release-assets -type f \( "$@" \) | head -n1 || true)
            if [[ -z "$found" ]]; then
              echo "MISSING: $label" >&2
              missing=1
            else
              echo "OK: $label -> $found"
            fi
          }
          # All of these must exist; otherwise do not create a Release.
          require "Windows Setup (.exe)" -name "Oxizip-Setup-${VER}-x64.exe"
          require "Debian package (.deb)" -name "Oxizip_${VER}_*.deb"
          require "RPM package (.rpm)" -name "Oxizip-${VER}-*.rpm"
          require "AppImage" -name "Oxizip-${VER}-*.AppImage"
          require "Linux tarball (.tar.gz)" -name "Oxizip-${VER}-linux-*.tar.gz"
          if [[ "$missing" -ne 0 ]]; then
            echo "Incomplete artifacts — skipping GitHub Release." >&2
            exit 1
          fi
          {
            echo "setup=$(find release-assets -type f -name "Oxizip-Setup-${VER}-x64.exe" | head -n1)"
            echo "deb=$(find release-assets -type f -name "Oxizip_${VER}_*.deb" | head -n1)"
            echo "rpm=$(find release-assets -type f -name "Oxizip-${VER}-*.rpm" | head -n1)"
            echo "appimage=$(find release-assets -type f -name "Oxizip-${VER}-*.AppImage" | head -n1)"
            echo "tarball=$(find release-assets -type f -name "Oxizip-${VER}-linux-*.tar.gz" | head -n1)"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG.md
        id: notes
        env:
          VER: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          # Escape regex metacharacters in X.Y.Z (dots are special in awk).
          ver_re=$(printf '%s' "$VER" | sed 's/\./\\./g')
          # Keep a Changelog: "## [X.Y.Z] - date" … until the *next* "## [" heading.
          # Do not exit on the same line that opens the section (old script did → empty notes).
          awk -v ver_re="$ver_re" '
            /^## \[/ {
              if ($0 ~ "^## \\[" ver_re "\\]") { on=1; print; next }
              if (on) exit
              next
            }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q . release-notes.md; then
            echo "CHANGELOG.md has no section for ${VER}" >&2
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "完整说明见仓库 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)。"
          } >> release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Oxizip ${{ needs.windows.outputs.version || github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          # Prefer Keep a Changelog body over GitHub auto notes.
          generate_release_notes: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
          # Explicit paths only — never publish a partial set.
          files: |
            ${{ steps.assets.outputs.setup }}
            ${{ steps.assets.outputs.deb }}
            ${{ steps.assets.outputs.rpm }}
            ${{ steps.assets.outputs.appimage }}
            ${{ steps.assets.outputs.tarball }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

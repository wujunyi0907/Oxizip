[package]
name = "oxizip-shellext"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Oxizip Explorer shell extension (IExplorerCommand + classic IContextMenu3); launches oxizip-cli only"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.oxizip]
# COM DLL exports marked PRIVATE via .def (see build.rs).

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
